# Text-To-Speach Config

enabled = false

[connection]
url = "http://127.0.0.1:5002"
token = "local-piper"
timeout_seconds = 30
max_concurrent_requests = 4

[server]
host = "127.0.0.1"
port = 5002
voices_dir = ".TTS/voices"
max_speakers_per_model = 150
effect_speakers_per_model = 6
out_rate = 44100
out_bitrate = "128k"
noise_scale = 0.45
noise_w = 0.55
length_scale = 1.0
list = "personas"

[voices]
blacklist = []
tram_announcer = ""
computer = ""

